<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>林林 & 倍倍</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/site.css">
</head>
<body>
  <div id="heart-layer"></div>
  <div class="enter-flash" id="flash"></div>
  <main class="open-wrap fade-page">
    <div class="open-glow" style="top:18%;left:50%;transform:translateX(-50%);"></div>
    <div class="envelope" id="envelope" aria-hidden="true">
      <div class="envelope-body"></div>
      <div class="envelope-flap"></div>
      <div class="envelope-heart">❤</div>
    </div>
    <p style="letter-spacing:0.28em;font-size:0.8rem;color:rgba(243,213,224,0.65);margin:0 0 0.75rem;position:relative;z-index:2;">我们的纪念站</p>
    <h1 class="serif gradient-text" style="font-size:clamp(2.4rem,10vw,3.6rem);margin:0 0 0.6rem;position:relative;z-index:2;">林林 & 倍倍</h1>
    <p style="color:rgba(247,239,232,0.6);margin:0 0 2rem;max-width:18rem;position:relative;z-index:2;">从 2025.1.1 开始的故事，点开看看</p>
    <button type="button" class="btn" id="enterBtn" style="position:relative;z-index:2;">打开我们的世界</button>
  </main>
  <script src="js/effects.js"></script>
  <script src="js/fx-engine.js"></script>
  <script>
    FX.mountPretty('full');
    const envelope = document.getElementById('envelope');
    const flash = document.getElementById('flash');
    let going = false;
    const enter = (e) => {
      if (going) return;
      going = true;
      const x = e && e.clientX != null ? e.clientX : window.innerWidth / 2;
      const y = e && e.clientY != null ? e.clientY : window.innerHeight / 2;
      envelope.classList.add('open');
      FX.burstAt(x, y, 22);
      FX.releaseBalloons(14);
      flash.classList.add('on');
      setTimeout(() => { location.href = 'home.html'; }, 720);
    };
    document.getElementById('enterBtn').addEventListener('click', enter);
    envelope.addEventListener('click', enter);
  </script>
</body>
</html>
